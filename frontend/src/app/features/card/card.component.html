<div class="card-container">
  @if (loading()) {
    <div class="loading">Loading your bingo card...</div>
  } @else if (error()) {
    <div class="loading">{{ error() }}</div>
  } @else if (card()) {
    @if (hasBingo()) {
      <div class="bingo-banner" role="alert" aria-live="polite">
        🎉 Bingo!
      </div>
    }
    <div class="bingo-card" [class.card-won]="hasBingo()">
      @for (row of card(); track $index; let rowIndex = $index) {
        <div class="bingo-row">
          @for (cell of row; track $index; let colIndex = $index) {
            <button
              type="button"
              class="bingo-cell"
              [class.free-cell]="cell === 'FREE'"
              [class.stamped]="isStamped(rowIndex, colIndex, cell)"
              [attr.aria-pressed]="isStamped(rowIndex, colIndex, cell)"
              (click)="toggleStamp(rowIndex, colIndex, cell)"
            >
              <span class="cell-text">{{ cell }}</span>
              @if (isStamped(rowIndex, colIndex, cell)) {
                <span class="stamp-mark" aria-hidden="true">✓</span>
              }
            </button>
          }
        </div>
      }
    </div>
  }
</div>
