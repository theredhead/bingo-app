<section class="landing">
  <h1>Select a Game</h1>
  <div class="game-list">
    <button class="game-btn" (click)="selectGame('bingo')">
      <span>🎱</span>
      <strong>Bingo</strong>
      <span class="desc">Classic multiplayer bingo</span>
    </button>
    <button class="game-btn" (click)="selectGame('holdem')">
      <span>🃏</span>
      <strong>Texas Hold'em</strong>
      <span class="desc">Poker (coming soon)</span>
    </button>
  </div>
</section>
