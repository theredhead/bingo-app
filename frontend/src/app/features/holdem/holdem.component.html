<section class="holdem" [class.is-table]="step() === 'table'">
  @if (step() !== 'table') {
    <p class="page-eyebrow">Games</p>
    <h1>Texas Hold'em</h1>
  }

  @if (step() === 'landing') {
    <app-holdem-landing
      [publicTables]="publicTables()"
      [publicLoading]="publicLoading()"
      [balance]="balance()"
      [dailyBonusAwarded]="dailyBonusAwarded()"
      [loading]="loading()"
      [error]="error()"
      [displayName]="displayName()"
      [avatar]="avatar()"
      [pendingJoinId]="pendingJoinId()"
      (createClicked)="toCreate()"
      (joinClicked)="joinGame($event)"
      (startJoin)="pendingJoinId.set($event); error.set(null)"
      (cancelJoin)="pendingJoinId.set(null); error.set(null)"
      (avatarSelected)="selectAvatar($event)"
      (displayNameChanged)="onDisplayNameChanged($event)"
    />
  }

  @if (step() === 'create') {
    <app-holdem-create-form
      [loading]="loading()"
      [error]="error()"
      [displayName]="displayName()"
      [avatar]="avatar()"
      (createGame)="onCreateGame($event)"
      (back)="toLanding()"
      (avatarSelected)="selectAvatar($event)"
      (displayNameChanged)="onDisplayNameChanged($event)"
    />
  }

  @if (step() === 'table') {
    @if (!game()) {
      <div class="loading">Loading table…</div>
    } @else {
      <app-holdem-table
        [game]="game()!"
        [player]="player()"
        (action)="onAction($event)"
        (startGame)="onStartGame()"
        (leave)="toLanding()"
        (addBot)="onAddBot()"
        (removeBot)="onRemoveBot($event)"
        (sitHere)="onSitHere()"
      />
    }
  }
</section>
